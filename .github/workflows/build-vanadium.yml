# Percorso nel repo: .github/workflows/build-vanadium.yml (root del repo)
# Il contenuto dello zip è direttamente la root del repo (.gclient, args.gn, patches/ ...)
#
# ATTENZIONE: questa è una build completa di Chromium per Android (CFI + LTO).
# Serve ~150-200 GB di disco, molti core e diverse ore. I runner gratuiti
# (2 core, ~14 GB liberi, limite 6 h) NON bastano: usa un "larger runner"
# a pagamento (es. 32-64 core, 300+ GB) oppure un runner self-hosted.
#
# Secret richiesti (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    keystore JKS/PKCS12 in base64, alias "vanadium"
#   KEYSTORE_PASSWORD  password del keystore

name: Build Vanadium

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Label del runner (larger runner o self-hosted)"
        required: true
        default: "ubuntu-24.04"
      targets:
        description: "Target autoninja"
        required: true
        default: "vanadium_browser_apk vanadium_webview_apk vanadium_config_apk"

env:
  VANADIUM_DIR: "."
  DEPOT_TOOLS_UPDATE: "1"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2880

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Libera spazio (solo runner GitHub-hosted)
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Dipendenze di base
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl lsb-release xz-utils

      - name: Installa depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Leggi versione da args.gn
        working-directory: ${{ env.VANADIUM_DIR }}
        run: |
          VERSION=$(sed -n 's/^android_default_version_name = "\(.*\)"/\1/p' args.gn)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versione Chromium: $VERSION"

      - name: Scarica Chromium (gclient sync, senza hook)
        working-directory: ${{ env.VANADIUM_DIR }}
        run: |
          gclient sync --nohooks --no-history --jobs "$(nproc)" \
            --revision "src@refs/tags/$VERSION"

      - name: Installa dipendenze di build Android
        working-directory: ${{ env.VANADIUM_DIR }}
        run: sudo ./src/build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts

      - name: Applica le patch Vanadium
        working-directory: ${{ env.VANADIUM_DIR }}/src
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git am --whitespace=nowarn ../patches/*.patch

      - name: Hook gclient + patch dei sottoprogetti
        working-directory: ${{ env.VANADIUM_DIR }}
        run: |
          # L'hook "apply_subprojects_patches" del .gclient passa argomenti
          # posizionali, ma lo script richiede --src_dir/--base_patch_dir:
          # fallirebbe, quindi lo ignoro e lo rilancio a mano sotto.
          gclient runhooks || true
          test -s src/vanadium/android_config/filter_lists/filter_lists_easylist.txt
          python3 tools/common/apply_subprojects_patches.py \
            --src_dir src --base_patch_dir subprojects_patches

      - name: Prepara keystore e args.gn
        working-directory: ${{ env.VANADIUM_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ../vanadium.keystore
          DIGEST=$(keytool -list -v -keystore ../vanadium.keystore -alias vanadium \
            -storepass "$KS_PASS" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          test -n "$DIGEST"
          echo "Digest certificato: $DIGEST"
          mkdir -p src/out/Default
          cp args.gn src/out/Default/args.gn
          # I digest nell'args.gn originale sono della chiave ufficiale: li sostituisco con i tuoi
          sed -i -E "s/^(trichrome_certdigest|config_apk_certdigest) = .*/\1 = \"$DIGEST\"/" src/out/Default/args.gn

      - name: Compila
        working-directory: ${{ env.VANADIUM_DIR }}/src
        run: |
          gn gen out/Default
          autoninja -C out/Default ${{ inputs.targets }}

      - name: Firma gli APK
        working-directory: ${{ env.VANADIUM_DIR }}/src/out/Default/apks
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(find ../../../third_party/android_sdk/public/build-tools -name apksigner | sort -V | tail -1)
          rm -rf release && mkdir release
          for app in VanadiumBrowser VanadiumWebView VanadiumConfig; do
            input=$(ls ${app}*.apk 2>/dev/null | head -1 || true)
            if [ -z "$input" ]; then echo "manca $app"; continue; fi
            "$APKSIGNER" sign --ks ../../../../../vanadium.keystore --ks-pass env:KS_PASS \
              --ks-key-alias vanadium --in "$input" --out "release/$app.apk"
          done
          ls -lh release

      - name: Carica gli APK firmati
        uses: actions/upload-artifact@v4
        with:
          name: vanadium-apks
          path: ${{ env.VANADIUM_DIR }}/src/out/Default/apks/release/*.apk
          if-no-files-found: error
