# Percorso nel repo: .github/workflows/generate-keystore.yml
# Genera un keystore con alias "vanadium" e lo carica come artifact
# (conservato 1 giorno). Usalo UNA volta sola, poi cancella l'artifact.
# USALO SOLO IN UN REPO PRIVATO: gli artifact di un repo pubblico
# sono scaricabili da chiunque abbia un account GitHub.

name: Genera keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: Genera keystore e password casuale
        run: |
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore out/vanadium.keystore -alias vanadium \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Vanadium" -storepass "$PASS" -keypass "$PASS"
          base64 -w0 out/vanadium.keystore > out/KEYSTORE_BASE64.txt
          echo -n "$PASS" > out/KEYSTORE_PASSWORD.txt
          rm out/vanadium.keystore

      - name: Carica (1 giorno)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: out/
          retention-days: 1
